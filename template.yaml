AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Functionless URL Shortner

###################################################################################################
##   Template Parameters                                                                         ##
###################################################################################################
Parameters:
  AppName:
    Type: String
    Description: Name of application (no spaces). Value must be globally unique
    Default: shortener
  OrgId:
    Type: String
    Description: AWS Organization Id
  CustomDomainName:
    Type: String
    Description: >-
      Optional URL prefix used when formatting short URLs returned by the API (e.g. https://sho.rt).
      Defaults to https://<DomainAlias> when DomainAlias is set.
    Default: ''
  DomainAlias:
    Type: String
    Description: >-
      Optional custom hostname served by CloudFront (e.g. sho.rt or go.example.com).
      Requires AcmCertificateArn.
    Default: ''
    AllowedPattern: '^$|^(?!-)[a-z0-9-]{1,63}(?<!-)(\.(?!-)[a-z0-9-]{1,63}(?<!-))+$'
    ConstraintDescription: Must be a lowercase hostname without scheme or path (e.g. go.example.com).
  AcmCertificateArn:
    Type: String
    Description: >-
      ARN of an ACM certificate in us-east-1 that covers DomainAlias. Required when DomainAlias is set.
    Default: ''
    AllowedPattern: '^$|^arn:aws[a-z-]*:acm:us-east-1:\d{12}:certificate/[0-9a-f-]+$'
    ConstraintDescription: Must be an ACM certificate ARN in us-east-1 (CloudFront only accepts certificates from us-east-1).
  EnableDashboard:
    Type: String
    Description: Create a CloudWatch dashboard for link traffic and service health (first 3 dashboards per account are free)
    Default: 'true'
    AllowedValues: ['true', 'false']
  AlarmEmail:
    Type: String
    Description: Optional email address subscribed to alarm notifications (confirm the SNS subscription email after deploy)
    Default: ''
  EnableCloudFrontAdditionalMetrics:
    Type: String
    Description: >-
      Enable CloudFront additional metrics (needed for CacheHitRate and its alarm). Billed as CloudWatch custom metrics.
    Default: 'false'
    AllowedValues: ['true', 'false']
  HostedZoneId:
    Type: String
    Description: >-
      Optional Route 53 hosted zone ID for DomainAlias. When set, alias A/AAAA records pointing to CloudFront are created.
    Default: ''
  TTL:
    Type: Number
    Description: TTL time for url to be active
    Default: 31536000

###################################################################################################
##   Template Rules & Conditions                                                                 ##
###################################################################################################
Rules:
  CustomDomainRequiresCertificate:
    RuleCondition: !Not [!Equals [!Ref DomainAlias, '']]
    Assertions:
      - Assert: !Not [!Equals [!Ref AcmCertificateArn, '']]
        AssertDescription: AcmCertificateArn is required when DomainAlias is set.
  HostedZoneRequiresCustomDomain:
    RuleCondition: !Not [!Equals [!Ref HostedZoneId, '']]
    Assertions:
      - Assert: !Not [!Equals [!Ref DomainAlias, '']]
        AssertDescription: DomainAlias is required when HostedZoneId is set.

Conditions:
  HasDomainAlias: !Not [!Equals [!Ref DomainAlias, '']]
  CreateDashboard: !Equals [!Ref EnableDashboard, 'true']
  HasAlarmEmail: !Not [!Equals [!Ref AlarmEmail, '']]
  CloudFrontAdditionalMetrics: !Equals [!Ref EnableCloudFrontAdditionalMetrics, 'true']
  IsUsEast1: !Equals [!Ref AWS::Region, 'us-east-1']
  HasUrlPrefix: !Not [!Equals [!Ref CustomDomainName, '']]
  CreateDnsRecords: !And
    - !Condition HasDomainAlias
    - !Not [!Equals [!Ref HostedZoneId, '']]

###################################################################################################
##   Template Resources                                                                          ##
###################################################################################################
Resources:
  ##   API Gateway
  SiteAPI:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub ${AWS::StackName}-api # keep in sync with info.title in api.yaml; alarms filter on ApiName
      StageName: Prod
      EndpointConfiguration:
        Type: REGIONAL
      TracingEnabled: true
      Auth:
        ResourcePolicy:
          CustomStatements: [
            {
              Effect: 'Allow',
              Action: 'execute-api:Invoke',
              Resource: [ 'execute-api:/*/GET/*' ],
              Principal: '*'
            },
            {
              Effect: 'Deny',
              Action: 'execute-api:Invoke',
              Resource: [ 'execute-api:/*/*/api/*' ],
              Principal: '*',
              Condition: {
                StringNotEquals: {
                  "aws:PrincipalOrgID": !Ref OrgId
                }
              }
            },
            {
              Effect: 'Allow',
              Action: 'execute-api:Invoke',
              Resource: [ 'execute-api:/*/*/*' ],
              Principal: '*',
              Condition: {
                StringEquals: {
                  "aws:PrincipalOrgID": !Ref OrgId
                }
              }
            }
          ]
      MethodSettings:
        - HttpMethod: "*"
          ResourcePath: "/*"
          LoggingLevel: INFO
          DataTraceEnabled: true
          MetricsEnabled: true
          ThrottlingRateLimit: 2000
          ThrottlingBurstLimit: 1000
        - HttpMethod: "GET"
          ResourcePath: "/{linkId}"
          ThrottlingRateLimit: 10000
          ThrottlingBurstLimit: 4000
      DefinitionBody:
        'Fn::Transform':
          Name: 'AWS::Include'
          Parameters:
            Location: './api.yaml'

  ##   URL DynamoDB Table
  LinkTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
        - AttributeName: owner
          AttributeType: S
      GlobalSecondaryIndexes:
        - IndexName: OwnerIndex
          KeySchema:
            - AttributeName: owner
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  ##   CloudFront distribution
  CloudFrontDistro:
    Type: AWS::CloudFront::Distribution
    Metadata:
      cfn-lint:
        config:
          ignore_checks:
            - W1030 # AcmCertificateArn defaults to '' but is only referenced when HasDomainAlias is true
    Properties:
      DistributionConfig:
        Comment: URL Shortener CDN
        Aliases: !If [HasDomainAlias, [!Ref DomainAlias], !Ref AWS::NoValue]
        ViewerCertificate: !If
          - HasDomainAlias
          - AcmCertificateArn: !Ref AcmCertificateArn
            SslSupportMethod: sni-only
            MinimumProtocolVersion: TLSv1.2_2021
          - !Ref AWS::NoValue
        DefaultCacheBehavior:
          AllowedMethods: ["DELETE", "GET", "HEAD", "OPTIONS", "PATCH", "POST", "PUT"]
          CachedMethods: ["GET", "HEAD", "OPTIONS"]
          Compress: true
          DefaultTTL: 0
          ForwardedValues:
            Headers:
            - Access-Control-Request-Headers
            - Access-Control-Request-Method
            - Origin
            - Authorization
            QueryString: true
            QueryStringCacheKeys:
              - go
          TargetOriginId: "URLShortenerAPIGW"
          ViewerProtocolPolicy: redirect-to-https
        CustomErrorResponses:
        - ErrorCachingMinTTL: 0
          ErrorCode: 400
        - ErrorCachingMinTTL: 1
          ErrorCode: 403
        - ErrorCachingMinTTL: 5
          ErrorCode: 500
        Enabled: true
        Origins:
          - CustomOriginConfig:
              OriginProtocolPolicy: https-only
            DomainName: !Sub ${SiteAPI}.execute-api.${AWS::Region}.amazonaws.com
            Id: "URLShortenerAPIGW"
            OriginPath: /Prod

  ##   Route 53 alias records for the custom domain (optional)
  DomainRecordA:
    Type: AWS::Route53::RecordSet
    Condition: CreateDnsRecords
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainAlias
      Type: A
      AliasTarget:
        DNSName: !GetAtt CloudFrontDistro.DomainName
        HostedZoneId: Z2FDTNDATAQYW2 # CloudFront's fixed hosted zone ID

  DomainRecordAAAA:
    Type: AWS::Route53::RecordSet
    Condition: CreateDnsRecords
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainAlias
      Type: AAAA
      AliasTarget:
        DNSName: !GetAtt CloudFrontDistro.DomainName
        HostedZoneId: Z2FDTNDATAQYW2 # CloudFront's fixed hosted zone ID

###################################################################################################
##   IAM Roles                                                                                   ##
###################################################################################################

  ##   Dynamo DB Read Role
  DDBReadRole:
    Type: "AWS::IAM::Role"
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          -
            Effect: "Allow"
            Principal:
              Service: "apigateway.amazonaws.com"
            Action:
              - "sts:AssumeRole"
      Policies:
        - PolicyName: DDBReadPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              Action:
              - dynamodb:GetItem
              - dynamodb:Scan
              - dynamodb:Query
              Effect: Allow
              Resource:
                - !GetAtt LinkTable.Arn
                - !Sub
                  - ${TableArn}/index/*
                  - {TableArn: !GetAtt LinkTable.Arn}

  ##   Dynamo DB Read/Write Role
  DDBCrudRole:
    Type: "AWS::IAM::Role"
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          -
            Effect: "Allow"
            Principal:
              Service: "apigateway.amazonaws.com"
            Action:
              - "sts:AssumeRole"
      Policies:
        - PolicyName: DDBCrudPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              Action:
              - dynamodb:DeleteItem
              - dynamodb:UpdateItem
              Effect: Allow
              Resource: !GetAtt LinkTable.Arn

###################################################################################################
##   Metrics outputs                                                                            ##
###################################################################################################

  NotifyTopic:
    Type: AWS::SNS::Topic

  NotifyEmailSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasAlarmEmail
    Properties:
      TopicArn: !Ref NotifyTopic
      Protocol: email
      Endpoint: !Ref AlarmEmail

  APIGateway4xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AWS::StackName} API 4xx"
      AlarmDescription: API Gateway 4xx error rate above 1% (Average of 4XXError is the error rate)
      Namespace: AWS/ApiGateway
      MetricName: 4XXError
      Dimensions:
        - Name: ApiName
          Value: !Sub ${AWS::StackName}-api
        - Name: Stage
          Value: Prod
      Statistic: Average
      Period: 60
      EvaluationPeriods: 1
      Threshold: 0.01
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref NotifyTopic

  APIGateway5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AWS::StackName} API 5xx"
      AlarmDescription: API Gateway 5xx error rate above 1% (Average of 5XXError is the error rate)
      Namespace: AWS/ApiGateway
      MetricName: 5XXError
      Dimensions:
        - Name: ApiName
          Value: !Sub ${AWS::StackName}-api
        - Name: Stage
          Value: Prod
      Statistic: Average
      Period: 60
      EvaluationPeriods: 1
      Threshold: 0.01
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref NotifyTopic

  APIGatewayLatencyAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AWS::StackName} API Latency"
      AlarmDescription: API Gateway p99 latency above 75 ms
      Namespace: AWS/ApiGateway
      MetricName: Latency
      Dimensions:
        - Name: ApiName
          Value: !Sub ${AWS::StackName}-api
        - Name: Stage
          Value: Prod
      ExtendedStatistic: p99
      Period: 300
      EvaluationPeriods: 1
      Threshold: 75
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref NotifyTopic

  ##   DynamoDB publishes SystemErrors only on the TableName + Operation pair, so sum the
  ##   operations the API uses (GetItem, UpdateItem, DeleteItem). Alarms cannot use SEARCH().
  DDB5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AWS::StackName} DynamoDB SystemErrors"
      AlarmDescription: DynamoDB system (5xx) errors on the link table
      Metrics:
        - Id: total
          Label: SystemErrors
          Expression: FILL(getitem, 0) + FILL(updateitem, 0) + FILL(deleteitem, 0)
          ReturnData: true
        - Id: getitem
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/DynamoDB
              MetricName: SystemErrors
              Dimensions:
                - Name: TableName
                  Value: !Ref LinkTable
                - Name: Operation
                  Value: GetItem
            Period: 60
            Stat: Sum
        - Id: updateitem
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/DynamoDB
              MetricName: SystemErrors
              Dimensions:
                - Name: TableName
                  Value: !Ref LinkTable
                - Name: Operation
                  Value: UpdateItem
            Period: 60
            Stat: Sum
        - Id: deleteitem
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/DynamoDB
              MetricName: SystemErrors
              Dimensions:
                - Name: TableName
                  Value: !Ref LinkTable
                - Name: Operation
                  Value: DeleteItem
            Period: 60
            Stat: Sum
      EvaluationPeriods: 5
      DatapointsToAlarm: 2
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref NotifyTopic

  ##   CloudFront additional metrics (required for CacheHitRate; billed as CloudWatch custom metrics)
  CloudFrontMonitoringSubscription:
    Type: AWS::CloudFront::MonitoringSubscription
    Condition: CloudFrontAdditionalMetrics
    Properties:
      DistributionId: !Ref CloudFrontDistro
      MonitoringSubscription:
        RealtimeMetricsSubscriptionConfig:
          RealtimeMetricsSubscriptionStatus: Enabled

  ##   CloudFront metrics exist only in us-east-1, so CloudFront alarms (and their SNS topic)
  ##   live in cloudfront-alarms.yaml. Nested automatically when this stack is in us-east-1;
  ##   otherwise deploy cloudfront-alarms.yaml in us-east-1 yourself (see README).
  CloudFrontAlarms:
    Type: AWS::CloudFormation::Stack
    Condition: IsUsEast1
    Properties:
      TemplateURL: cloudfront-alarms.yaml
      Parameters:
        DistributionId: !Ref CloudFrontDistro
        AlarmNamePrefix: !Ref AWS::StackName
        AlarmTopicArn: !Ref NotifyTopic
        EnableCacheHitRateAlarm: !Ref EnableCloudFrontAdditionalMetrics

  ##   CloudWatch dashboard (optional)
  TrafficDashboard:
    Type: AWS::CloudWatch::Dashboard
    Condition: CreateDashboard
    Properties:
      DashboardName: !Sub ${AWS::StackName}-traffic
      DashboardBody: !Sub |
        {
          "widgets": [
            {
              "type": "text",
              "x": 0,
              "y": 0,
              "width": 24,
              "height": 2,
              "properties": {
                "markdown": "# ${AWS::StackName} — URL Shortener\nCloudFront metrics are global and shown from **us-east-1**; API Gateway and DynamoDB metrics are from **${AWS::Region}**."
              }
            },
            {
              "type": "metric",
              "x": 0,
              "y": 2,
              "width": 8,
              "height": 6,
              "properties": {
                "title": "CloudFront requests",
                "view": "timeSeries",
                "region": "us-east-1",
                "stat": "Sum",
                "period": 300,
                "metrics": [
                  [
                    "AWS/CloudFront",
                    "Requests",
                    "DistributionId",
                    "${CloudFrontDistro}",
                    "Region",
                    "Global"
                  ]
                ]
              }
            },
            {
              "type": "metric",
              "x": 8,
              "y": 2,
              "width": 8,
              "height": 6,
              "properties": {
                "title": "CloudFront error rate (%)",
                "view": "timeSeries",
                "region": "us-east-1",
                "stat": "Average",
                "period": 300,
                "metrics": [
                  [
                    "AWS/CloudFront",
                    "4xxErrorRate",
                    "DistributionId",
                    "${CloudFrontDistro}",
                    "Region",
                    "Global"
                  ],
                  [
                    "AWS/CloudFront",
                    "5xxErrorRate",
                    "DistributionId",
                    "${CloudFrontDistro}",
                    "Region",
                    "Global"
                  ],
                  [
                    "AWS/CloudFront",
                    "TotalErrorRate",
                    "DistributionId",
                    "${CloudFrontDistro}",
                    "Region",
                    "Global"
                  ]
                ]
              }
            },
            {
              "type": "metric",
              "x": 16,
              "y": 2,
              "width": 8,
              "height": 6,
              "properties": {
                "title": "CloudFront cache hit rate (%) — requires additional metrics",
                "view": "timeSeries",
                "region": "us-east-1",
                "stat": "Average",
                "period": 300,
                "metrics": [
                  [
                    "AWS/CloudFront",
                    "CacheHitRate",
                    "DistributionId",
                    "${CloudFrontDistro}",
                    "Region",
                    "Global"
                  ]
                ],
                "yAxis": {
                  "left": {
                    "min": 0,
                    "max": 100
                  }
                }
              }
            },
            {
              "type": "metric",
              "x": 0,
              "y": 8,
              "width": 8,
              "height": 6,
              "properties": {
                "title": "API Gateway requests",
                "view": "timeSeries",
                "region": "${AWS::Region}",
                "stat": "Sum",
                "period": 300,
                "metrics": [
                  [
                    "AWS/ApiGateway",
                    "Count",
                    "ApiName",
                    "${AWS::StackName}-api"
                  ]
                ]
              }
            },
            {
              "type": "metric",
              "x": 8,
              "y": 8,
              "width": 8,
              "height": 6,
              "properties": {
                "title": "API Gateway latency (ms)",
                "view": "timeSeries",
                "region": "${AWS::Region}",
                "stat": "p99",
                "period": 300,
                "metrics": [
                  [
                    "AWS/ApiGateway",
                    "Latency",
                    "ApiName",
                    "${AWS::StackName}-api",
                    {
                      "stat": "p50",
                      "label": "Latency p50"
                    }
                  ],
                  [
                    "AWS/ApiGateway",
                    "Latency",
                    "ApiName",
                    "${AWS::StackName}-api",
                    {
                      "stat": "p99",
                      "label": "Latency p99"
                    }
                  ],
                  [
                    "AWS/ApiGateway",
                    "IntegrationLatency",
                    "ApiName",
                    "${AWS::StackName}-api",
                    {
                      "stat": "p99",
                      "label": "Integration p99"
                    }
                  ]
                ]
              }
            },
            {
              "type": "metric",
              "x": 16,
              "y": 8,
              "width": 8,
              "height": 6,
              "properties": {
                "title": "API Gateway errors",
                "view": "timeSeries",
                "region": "${AWS::Region}",
                "stat": "Sum",
                "period": 300,
                "metrics": [
                  [
                    "AWS/ApiGateway",
                    "4XXError",
                    "ApiName",
                    "${AWS::StackName}-api"
                  ],
                  [
                    "AWS/ApiGateway",
                    "5XXError",
                    "ApiName",
                    "${AWS::StackName}-api"
                  ]
                ]
              }
            },
            {
              "type": "metric",
              "x": 0,
              "y": 14,
              "width": 8,
              "height": 6,
              "properties": {
                "title": "DynamoDB consumed capacity",
                "view": "timeSeries",
                "region": "${AWS::Region}",
                "stat": "Sum",
                "period": 300,
                "metrics": [
                  [
                    "AWS/DynamoDB",
                    "ConsumedReadCapacityUnits",
                    "TableName",
                    "${LinkTable}"
                  ],
                  [
                    "AWS/DynamoDB",
                    "ConsumedWriteCapacityUnits",
                    "TableName",
                    "${LinkTable}"
                  ]
                ]
              }
            },
            {
              "type": "metric",
              "x": 8,
              "y": 14,
              "width": 8,
              "height": 6,
              "properties": {
                "title": "DynamoDB throttles",
                "view": "timeSeries",
                "region": "${AWS::Region}",
                "stat": "Sum",
                "period": 300,
                "metrics": [
                  [
                    "AWS/DynamoDB",
                    "ReadThrottleEvents",
                    "TableName",
                    "${LinkTable}"
                  ],
                  [
                    "AWS/DynamoDB",
                    "WriteThrottleEvents",
                    "TableName",
                    "${LinkTable}"
                  ]
                ]
              }
            },
            {
              "type": "metric",
              "x": 16,
              "y": 14,
              "width": 8,
              "height": 6,
              "properties": {
                "title": "DynamoDB system errors",
                "view": "timeSeries",
                "region": "${AWS::Region}",
                "stat": "Sum",
                "period": 300,
                "metrics": [
                  [
                    {
                      "expression": "SEARCH('{AWS/DynamoDB,Operation,TableName} MetricName=\"SystemErrors\" TableName=\"${LinkTable}\"', 'Sum', 300)",
                      "id": "e1",
                      "label": "SystemErrors"
                    }
                  ]
                ]
              }
            },
            {
              "type": "alarm",
              "x": 0,
              "y": 20,
              "width": 24,
              "height": 4,
              "properties": {
                "title": "Alarm status",
                "alarms": [
                  "${APIGateway4xxAlarm.Arn}",
                  "${APIGateway5xxAlarm.Arn}",
                  "${APIGatewayLatencyAlarm.Arn}",
                  "${DDB5xxAlarm.Arn}"
                ]
              }
            }
          ]
        }

###################################################################################################
##   Template outputs                                                                            ##
###################################################################################################

Outputs:
  AppName:
    Description: Name of your application
    Value: !Ref AppName

  AppAPIRoot:
    Description: API Gateway endpoint URL for linker
    Value: !GetAtt CloudFrontDistro.DomainName

  ManagementApiEndpoint:
    Description: SigV4 management API endpoint (call this directly, not via CloudFront); used by the shorten CLI
    Value: !Sub https://${SiteAPI}.execute-api.${AWS::Region}.amazonaws.com/Prod

  DashboardUrl:
    Condition: CreateDashboard
    Description: CloudWatch dashboard for link traffic and service health
    Value: !Sub https://${AWS::Region}.console.aws.amazon.com/cloudwatch/home?region=${AWS::Region}#dashboards/dashboard/${TrafficDashboard}

  CloudFrontDistributionId:
    Description: CloudFront distribution ID (pass to cloudfront-alarms.yaml when deploying it in us-east-1)
    Value: !Ref CloudFrontDistro

  AlarmTopicArn:
    Description: SNS topic receiving regional alarm notifications
    Value: !Ref NotifyTopic

  ShortUrlBase:
    Description: Base URL for short links (CustomDomainName, else https://DomainAlias, else the CloudFront domain)
    Value: !If
      - HasUrlPrefix
      - !Ref CustomDomainName
      - !If
        - HasDomainAlias
        - !Sub https://${DomainAlias}
        - !Sub https://${CloudFrontDistro.DomainName}

  DnsTarget:
    Condition: HasDomainAlias
    Description: Point a CNAME (or Route 53 alias) for DomainAlias at this CloudFront domain if HostedZoneId was not provided
    Value: !GetAtt CloudFrontDistro.DomainName
